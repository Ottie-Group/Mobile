name: Mobile Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Extract Tag Version
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE="${{ github.run_number }}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG_NAME}, Version: ${VERSION_NAME}, Code: ${VERSION_CODE}"

      - name: Build Web Frontend
        run: |
          if [ -d "ottie-mobile" ]; then
            cd ottie-mobile
          fi
          bun install --frozen-lockfile || bun install
          bun run build
          bunx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -d "ottie-mobile" ]; then
            cd ottie-mobile/android
          else
            cd android
          fi
          chmod +x gradlew

      - name: Build Debug & Release APKs
        run: |
          if [ -d "ottie-mobile" ]; then
            cd ottie-mobile/android
          else
            cd android
          fi
          ./gradlew assembleDebug assembleRelease \
            -PversionName="${{ steps.vars.outputs.version_name }}" \
            -PversionCode="${{ steps.vars.outputs.version_code }}"

      - name: Stage & Rename APK Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.vars.outputs.tag }}"

          if [ -d "ottie-mobile/android" ]; then
            APP_DIR="ottie-mobile/android/app/build/outputs/apk"
          else
            APP_DIR="android/app/build/outputs/apk"
          fi

          if [ -f "$APP_DIR/debug/app-debug.apk" ]; then
            cp "$APP_DIR/debug/app-debug.apk" "release-artifacts/ottie-${TAG}-debug.apk"
          fi

          if [ -f "$APP_DIR/release/app-release.apk" ]; then
            cp "$APP_DIR/release/app-release.apk" "release-artifacts/ottie-${TAG}-release.apk"
          elif [ -f "$APP_DIR/release/app-release-unsigned.apk" ]; then
            cp "$APP_DIR/release/app-release-unsigned.apk" "release-artifacts/ottie-${TAG}-release.apk"
          fi

          ls -lah release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Ottie ${{ steps.vars.outputs.tag }}
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}